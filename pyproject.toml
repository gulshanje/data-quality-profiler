[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataqualityprofiler"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
dataqualityprofiler = "dataqualityprofiler.cli:main"